<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satellite Embeddings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  </head>
  <body>
    <div id="loading"></div>

    <div id="page-container">
      <div id="left-column">
        <div id="controls">
          <h2>Parameters</h2>

          <div class="control-group">
            <label>
              Samples <span class="slider-value" id="samples-value">100</span>
            </label>
            <input
              type="range"
              id="samples-slider"
              min="1"
              max="1000"
              value="100"
              step="1"
            />
          </div>

          <div class="control-group">
            <label>Dimensions</label>
            <div class="toggle-group">
              <button class="toggle-btn" data-dimension="1">1D</button>
              <button class="toggle-btn active" data-dimension="2">2D</button>
              <button class="toggle-btn" data-dimension="3">3D</button>
            </div>
          </div>

          <div class="control-group">
            <label>Dimension Reduction Algorithm</label>
            <div class="toggle-group">
              <button class="toggle-btn active" data-algo="umap">UMAP</button>
              <button class="toggle-btn" data-algo="tsne">t-SNE</button>
            </div>
          </div>

          <div class="control-group">
            <label>Image</label>
            <div class="toggle-group">
              <button class="toggle-btn" data-imgtype="rgb">Satellite</button>
              <button class="toggle-btn active" data-imgtype="embed">
                Embedding
              </button>
            </div>
          </div>

          <div
            class="control-group"
            id="camera-control-group"
            style="display: none"
          >
            <label>Camera Control</label>
            <div class="toggle-group">
              <button class="toggle-btn active" data-camera="orbit">
                Mouse
              </button>
              <button class="toggle-btn" data-camera="fly">Keyboard</button>
            </div>
          </div>

          <div
            class="control-group"
            id="camera-speed-group"
            style="display: none"
          >
            <label>
              Camera Speed
              <span class="slider-value" id="camera-speed-value">0.3</span>
            </label>
            <input
              type="range"
              id="camera-speed-slider"
              min="0.1"
              max="1.0"
              value="0.3"
              step="0.05"
            />
          </div>

          <div class="control-group" id="gap-control-group">
            <label>
              Image Gap <span class="slider-value" id="gap-value">3</span>
            </label>
            <input
              type="range"
              id="gap-slider"
              min="0"
              max="10"
              value="3"
              step="1"
            />
          </div>

          <button id="save-btn" class="action-btn">&#8681; Save Image</button>
        </div>

        <div id="info">
          <div><span class="label">Location</span></div>
          <div class="value" id="info-location">—</div>
          <div><span class="label">Land Classification</span></div>
          <div class="value" id="info-class">—</div>
          <div><span class="label">Region</span></div>
          <div class="value" id="info-region">—</div>
        </div>
      </div>

      <div id="middle-column">
        <div id="container">
          <div id="grid-1d"></div>
          <div id="grid-2d"></div>
          <canvas id="grid-3d"></canvas>
        </div>

        <!-- Modal for enlarged satellite patch -->
        <div id="modal-overlay">
          <div id="modal-content">
            <img id="modal-image" src="" alt="Satellite patch" />
            <button id="modal-close">&times;</button>
          </div>
        </div>
      </div>

      <div id="right-column">
        <!-- Band Selector -->
        <div id="band-selector">
          <div id="band-selector-label">False Color Bands</div>
          <div id="band-scale"></div>
          <div id="band-handle">
            <div id="band-value">0-2</div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
