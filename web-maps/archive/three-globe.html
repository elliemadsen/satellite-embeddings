<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Three.js Tile Globe</title>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: white;
      }
      #container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="container"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three",
          "three/": "https://esm.sh/three/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js";
      import ThreeGlobe from "https://esm.sh/three-globe?external=three";

      /* ---------------------------------------------------------
   SETUP SCENE
--------------------------------------------------------- */

      const container = document.getElementById("container");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        1,
        30000000
      );
      camera.position.z = 500;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableZoom = true;
      controls.minDistance = 200;
      controls.maxDistance = 2000;

      /* ---------------------------------------------------------
   BASE GLOBE
--------------------------------------------------------- */

      const Globe = new ThreeGlobe().globeImageUrl(null).bumpImageUrl(null);

      Globe.scale.set(100, 100, 100);
      scene.add(Globe);

      /* ---------------------------------------------------------
   TILE SYSTEM (Cesium-style)
--------------------------------------------------------- */

      const YEAR = 2024;
      const TILE_MAX_LEVEL = 5;
      const TILE_URL = "../tiles/{z}/{x}/{y}.png";

      const tileGroup = new THREE.Group();
      scene.add(tileGroup);

      const tileGeometryCache = {};

      function makeTileMesh(z, x, y) {
        const key = `${z}_${x}_${y}`;
        if (tileGeometryCache[key]) return tileGeometryCache[key];

        const tilesAtLevel = 1 << z;
        const lonPerTile = 360 / tilesAtLevel;
        const latPerTile = 180 / tilesAtLevel;

        const west = -180 + x * lonPerTile;
        const east = west + lonPerTile;
        const north = 90 - y * latPerTile;
        const south = north - latPerTile;

        const radius = 100;

        const lon1 = THREE.MathUtils.degToRad(west);
        const lon2 = THREE.MathUtils.degToRad(east);
        const lat1 = THREE.MathUtils.degToRad(north);
        const lat2 = THREE.MathUtils.degToRad(south);

        const segs = 16;

        const geo = new THREE.SphereGeometry(
          radius,
          segs,
          segs,
          lon1,
          lon2 - lon1,
          Math.PI / 2 - lat1,
          lat1 - lat2
        );

        tileGeometryCache[key] = geo;
        return geo;
      }

      function createTile(z, x, y) {
        const url = TILE_URL.replace("{z}", z)
          .replace("{x}", x)
          .replace("{y}", y);

        const texture = new THREE.TextureLoader().load(url);

        const geometry = makeTileMesh(z, x, y);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.FrontSide,
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.tile_id = `${z}_${x}_${y}`;
        return mesh;
      }

      function updateTiles() {
        tileGroup.clear();

        const dist = camera.position.length();
        let level;

        if (dist > 8000) level = 1;
        else if (dist > 4000) level = 2;
        else if (dist > 2000) level = 3;
        else if (dist > 1000) level = 4;
        else level = TILE_MAX_LEVEL;

        const n = 1 << level;

        for (let x = 0; x < n; x++) {
          for (let y = 0; y < n; y++) {
            tileGroup.add(createTile(level, x, y));
          }
        }
      }

      /* ---------------------------------------------------------
   RENDER LOOP
--------------------------------------------------------- */

      updateTiles();

      let lastDistance = camera.position.length();

      function animate() {
        requestAnimationFrame(animate);

        controls.update();

        const d = camera.position.length();
        if (Math.abs(d - lastDistance) > 50) {
          lastDistance = d;
          updateTiles();
        }

        renderer.render(scene, camera);
      }

      animate();

      /* ---------------------------------------------------------
   RESIZE
--------------------------------------------------------- */

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
