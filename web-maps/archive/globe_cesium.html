<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>alphaearth2024</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js"></script>
    <link
      href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: black;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <script>
      // Create viewer without terrain
      const viewer = new Cesium.Viewer("cesiumContainer", {
        imageryProvider: false,
        baseLayerPicker: false,
        geocoder: false,
        timeline: false,
        animation: false,
      });

      const YEAR = 2024;

      // Add your local AlphaEarth tiles as a globe imagery layer
      const alphaEarthLayer = viewer.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
          url: "../tiles/" + YEAR + "/{z}/{x}/{y}.png",
          maximumLevel: 5,
        })
      );

      alphaEarthLayer.alpha = 1.0;

      // Fly to full globe
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(0, 0, 10000000),
      });
    </script>
  </body>
</html>
