<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Point Cloud Viewer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        display: flex;
        font-family: Arial, sans-serif;
      }

      #sidebar {
        width: 260px;
        background: #f3f3f3;
        padding: 20px;
        border-right: 1px solid #ccc;
        box-sizing: border-box;
        overflow-y: auto;
        height: 100vh;
      }

      #sidebar h3 {
        margin-top: 0;
        font-size: 16px;
      }

      #sidebar label {
        font-size: 14px;
      }

      .section {
        margin-bottom: 25px;
      }

      label {
        display: block;
        cursor: pointer;
        margin-bottom: 6px;
      }

      input[type="radio"] {
        margin-right: 6px;
      }

      #container {
        flex-grow: 1;
      }

      .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 6px;
        font-size: 10px;
      }
      .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 8px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="section">
        <h3>Projection</h3>
        <label
          ><input type="radio" name="projection" value="globe" checked />World
          Space</label
        >
        <label
          ><input type="radio" name="projection" value="embedding" />Embedding
          Space</label
        >
      </div>

      <div class="section">
        <h3>Dimension Reduction</h3>
        <label
          ><input type="radio" name="dim_reduction" value="tsne" checked />
          t-SNE</label
        >
        <label
          ><input type="radio" name="dim_reduction" value="umap" /> UMAP</label
        >
      </div>

      <div class="section">
        <h3>Legend Display</h3>
        <label
          ><input type="radio" name="color" value="classification" checked />
          Land Classification</label
        >
        <label><input type="radio" name="color" value="region" /> Region</label>
      </div>

      <div class="section">
        <h3 id="legend-title">Legend</h3>
        <div id="legend"></div>
      </div>
    </div>

    <div id="container"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js";

      let features, N;
      let positions, colors;
      let geometry, points;
      let geojson;

      fetch("data/2000_sampled_classified_embeddings.geojson")
        .then((r) => r.json())
        .then((d) => {
          geojson = d;
          initPointCloud();

          document
            .querySelectorAll(
              "input[name='dim_reduction'], input[name='color'], input[name='projection']"
            )
            .forEach((el) =>
              el.addEventListener("change", () => {
                updatePointCloud();
                updateLegend();
              })
            );
        });

      const LAND_CLASSIFICATION_LEGEND = {
        0: ["#282828", "Unknown / No Data"],
        20: ["#ffbb22", "Shrubs"],
        30: ["#ffff4c", "Herbaceous vegetation"],
        40: ["#f096ff", "Cultivated / Agriculture"],
        50: ["#fa0000", "Urban / Built-up"],
        60: ["#b4b4b4", "Bare / Sparse vegetation"],
        70: ["#3ed8d3", "Snow and Ice"],
        80: ["#0032c8", "Permanent water bodies"],
        90: ["#0096a0", "Herbaceous wetland"],
        100: ["#fae6a0", "Moss & Lichen"],
        // 111: ["#58481f", "Closed forest – evergreen needleleaf"],
        // 112: ["#009900", "Closed forest – evergreen broadleaf"],
        // 113: ["#70663e", "Closed forest – deciduous needleleaf"],
        // 114: ["#00cc00", "Closed forest – deciduous broadleaf"],
        // 115: ["#4e751f", "Closed forest – mixed"],
        // 116: ["#007800", "Closed forest – other"],
        // 121: ["#666000", "Open forest – evergreen needleleaf"],
        // 122: ["#8db400", "Open forest – evergreen broadleaf"],
        // 123: ["#8d7400", "Open forest – deciduous needleleaf"],
        // 124: ["#a0dc00", "Open forest – deciduous broadleaf"],
        // 125: ["#929900", "Open forest – mixed"],
        // 126: ["#648c00", "Open forest – other"],
        200: ["#000080", "Oceans / Seas"],
        cf: ["#228B22", "Closed Forest"],
        of: ["#7FBF3F", "Open Forest"],
      };

      const SUBREGION_LEGEND = {
        0: ["#282828", "Unknown / No Data"],
        15.0: ["#d65e27", "Northern Africa"],
        202.0: ["#e03c3c", "Sub-Saharan Africa"],
        419.0: ["#885a48", "Latin America and the Caribbean"],
        21.0: ["#D59124", "Northern America"],
        143.0: ["#6ebe61", "Central Asia"],
        30.0: ["#4d7953", "Eastern Asia"],
        35.0: ["#62a8c4", "South-eastern Asia"],
        34.0: ["#355a9e", "Southern Asia"],
        145.0: ["#1e98c0", "Western Asia"],
        151.0: ["#bcbc65", "Eastern Europe"],
        154.0: ["#a3d660", "Northern Europe"],
        39.0: ["#e9dc49", "Southern Europe"],
        155.0: ["#fff27c", "Western Europe"],
        53.0: ["#9182b6", "Australia and New Zealand"],
        54.0: ["#875ca8", "Melanesia"],
        57.0: ["#f899ea", "Micronesia"],
        61.0: ["#ff9896", "Polynesia"],
      };

      let radius = 40;

      function latLonToSphere(lat, lon, r = radius) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (180 - lon) * (Math.PI / 180); // Flip lon: 180-lon instead of lon+180

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.cos(phi);
        const z = r * Math.sin(phi) * Math.sin(theta);

        return { x, y, z };
      }

      const container = document.getElementById("container");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
      );
      camera.position.set(50, 50, 50);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth - 260, window.innerHeight);
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth - 260, window.innerHeight);
        camera.aspect = (window.innerWidth - 260) / window.innerHeight;
        camera.updateProjectionMatrix();
      });

      function initPointCloud() {
        features = geojson.features;

        N = features.length;
        positions = new Float32Array(N * 3);
        colors = new Float32Array(N * 3);

        // Store original embedding positions + globe positions
        window.embeddingPositions = new Float32Array(N * 3);
        window.globePositions = new Float32Array(N * 3);

        // Fill both arrays after reading features
        for (let i = 0; i < N; i++) {
          const p = features[i].properties;

          // store embedding
          embeddingPositions[i * 3 + 0] = p.tsne_3d_x;
          embeddingPositions[i * 3 + 1] = p.tsne_3d_y;
          embeddingPositions[i * 3 + 2] = p.tsne_3d_z;

          // compute geo sphere position
          const { x, y, z } = latLonToSphere(p.lat, p.lon);
          globePositions[i * 3 + 0] = x;
          globePositions[i * 3 + 1] = y;
          globePositions[i * 3 + 2] = z;
        }

        geometry = new THREE.BufferGeometry();

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3)
        );
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: 0.8,
          vertexColors: true,
        });

        points = new THREE.Points(geometry, material);
        scene.add(points);

        updatePointCloud();
        updateLegend();
      }

      function remapForestClass(c) {
        if (c >= 111 && c <= 116) return "cf";
        if (c >= 121 && c <= 126) return "of";
        return c;
      }

      function updatePointCloud(duration = 1200) {
        if (!features) return;

        const dim_reduction = document.querySelector(
          'input[name="dim_reduction"]:checked'
        ).value;
        const projection = document.querySelector(
          'input[name="projection"]:checked'
        ).value;

        const colorMode = document.querySelector(
          'input[name="color"]:checked'
        ).value;

        // Compute target positions based on projection
        const targets = [];
        for (let i = 0; i < N; i++) {
          const p = features[i].properties;

          // --- COLOR ---
          let hex;
          if (colorMode === "classification") {
            const key = remapForestClass(p.classification);
            hex = (LAND_CLASSIFICATION_LEGEND[key] || ["#000000"])[0];
          } else {
            const key = p.subregion_code;
            hex = (SUBREGION_LEGEND[key] || ["#000000"])[0];
          }
          const c = new THREE.Color(hex);
          colors[i * 3 + 0] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;

          // --- TARGET POSITIONS ---
          let tx, ty, tz;
          if (projection === "embedding") {
            if (dim_reduction === "tsne") {
              tx = p.tsne_3d_x;
              ty = p.tsne_3d_y;
              tz = p.tsne_3d_z;
            } else {
              tx = p.umap_3d_x;
              ty = p.umap_3d_y;
              tz = p.umap_3d_z;
            }
          } else {
            const spherePos = latLonToSphere(p.lat, p.lon);
            tx = spherePos.x;
            ty = spherePos.y;
            tz = spherePos.z;
          }

          targets.push({ x: tx, y: ty, z: tz });
        }

        geometry.attributes.color.needsUpdate = true;

        // --- ANIMATION ---
        const startPositions = [];
        for (let i = 0; i < N; i++) {
          startPositions.push({
            x: positions[i * 3 + 0],
            y: positions[i * 3 + 1],
            z: positions[i * 3 + 2],
          });
        }

        const startTime = performance.now();

        function frame(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

          for (let i = 0; i < N; i++) {
            positions[i * 3 + 0] = THREE.MathUtils.lerp(
              startPositions[i].x,
              targets[i].x,
              eased
            );
            positions[i * 3 + 1] = THREE.MathUtils.lerp(
              startPositions[i].y,
              targets[i].y,
              eased
            );
            positions[i * 3 + 2] = THREE.MathUtils.lerp(
              startPositions[i].z,
              targets[i].z,
              eased
            );
          }

          geometry.attributes.position.needsUpdate = true;

          if (t < 1) requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      function updateLegend() {
        const colorMode = document.querySelector(
          'input[name="color"]:checked'
        ).value;
        const legendTitle = document.getElementById("legend-title");
        legendTitle.innerHTML =
          colorMode === "classification" ? "Land Classification" : "Region";

        const legendBox = document.getElementById("legend");

        const data =
          colorMode === "classification"
            ? LAND_CLASSIFICATION_LEGEND
            : SUBREGION_LEGEND;

        legendBox.innerHTML = "";

        for (const key in data) {
          const [hex, name] = data[key];

          const item = document.createElement("div");
          item.className = "legend-item";

          item.innerHTML = `
      <div class="legend-color" style="background:${hex};"></div>
      <div>${name}</div>
    `;

          legendBox.appendChild(item);
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
