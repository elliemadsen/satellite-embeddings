<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>two point projection</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-geo-projection@4"></script>
    <style>
      body {
        margin: 0;
        background: white;
      }
      svg {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #saveBtn {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 8px 14px;
        background: gray;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 14px;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- 🔘 DOWNLOAD BUTTON -->
    <button id="saveBtn">Save SVG</button>

    <script>
      const width = 1000;
      const height = 600;
      const a = [-70.5832, -5.8461]; // brazil
      const b = [23.4778, -0.5579]; // drc

      // greenland/alaska
      // const a = [-156.6759099098129, 62.717390421233034];
      // const b = [-39.64189749871104, 74.54031702302196];
      const sphere = { type: "Sphere" };
      const showOverlay = true;

      let land;
      let svgNode = null; // store reference for saving

      function renderMap() {
        let projection;
        try {
          projection = d3
            .geoTwoPointEquidistant(a, b)
            .scale(width / 5.2)
            .translate([width / 2, height / 2]);
        } catch (e) {
          projection = d3
            .geoAzimuthalEquidistant()
            .scale(150)
            .translate([width / 2, height / 2]);
        }

        const path = d3.geoPath(projection);
        const svg = d3.create("svg").attr("viewBox", [0, 0, width, height]);

        svg.append("path").attr("fill", "black").attr("d", path(sphere));

        svg.append("path").attr("fill", "white").attr("d", path(land));

        if (showOverlay) {
          const circle = d3.geoCircle();

          svg
            .append("g")
            .attr("fill", "none")
            .attr("stroke", "#85e085")
            .selectAll("path")
            .data(d3.range(10, 180, 10))
            .join("path")
            .attr("d", (r) => path(circle.center(a).radius(r)()));

          svg
            .append("g")
            .attr("fill", "none")
            .attr("stroke", "#80ccff") // blue
            .selectAll("path")
            .data(d3.range(10, 180, 10))
            .join("path")
            .attr("d", (r) => path(circle.center(b).radius(r)()));
        }

        svg
          .append("path")
          .attr("fill", "none")
          .attr("stroke", "#000")
          .attr("stroke-width", 1.5)
          .attr("d", path(sphere));

        svgNode = svg.node(); // store for download
        document.body.appendChild(svgNode);
      }

      // SAVE FUNCTION
      function saveSVG() {
        if (!svgNode) return;

        const serializer = new XMLSerializer();
        const source = serializer.serializeToString(svgNode);

        const blob = new Blob([source], {
          type: "image/svg+xml;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "projection.svg";
        link.click();

        URL.revokeObjectURL(url);
      }

      // CLICK HANDLER
      document.getElementById("saveBtn").addEventListener("click", saveSVG);

      // Load land file
      fetch("land-50m.json")
        .then((res) => res.json())
        .then((world) => {
          land = topojson.feature(world, world.objects.land);
          renderMap();
        })
        .catch((err) => {
          console.error(err);
          land = { type: "FeatureCollection", features: [] };
          renderMap();
        });
    </script>
  </body>
</html>
