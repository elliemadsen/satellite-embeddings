<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AlphaEarth Globe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl@2.5.0/dist/maplibre-gl.js"></script>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            alphaearth: {
              type: "raster",
              tiles: ["tiles/{z}/{x}/{y}.png"], // relative path to your local tiles folder
              tileSize: 256,
            },
          },
          layers: [
            {
              id: "alphaearth-layer",
              type: "raster",
              source: "alphaearth",
              minzoom: 0,
              maxzoom: 6,
            },
          ],
        },
        center: [0, 0],
        zoom: 1,
        projection: { name: "globe" }, // THIS makes it a globe
      });

      // Optional: add sky layer for atmosphere
      map.on("load", () => {
        map.addLayer({
          id: "sky",
          type: "sky",
          paint: {
            "sky-type": "atmosphere",
            "sky-atmosphere-sun": [0.0, 0.0],
            "sky-atmosphere-sun-intensity": 15,
          },
        });
      });
    </script>
  </body>
</html>
