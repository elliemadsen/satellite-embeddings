<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>embedding earth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --mono: "Courier New", monospace;
        --sans: "DM Sans", sans-serif;
      }

      body {
        margin: 0;
        overflow: hidden;
        display: flex;
        font-family: var(--sans);
        align-items: flex-start;
        background: white;
      }

      #sidebar {
        width: 280px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
        max-height: 100vh;
        box-sizing: border-box;
      }

      .sidebar-box {
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .section {
        margin-bottom: 16px;
        padding-top: 16px;
        border-top: 1px solid #eee;
      }

      .section:first-child {
        padding-top: 0;
        border-top: none;
      }

      .section:last-child {
        margin-bottom: 0;
      }

      .section h3 {
        margin: 0 0 14px 0;
        font-family: var(--mono);
        font-size: 13px;
        text-transform: uppercase;
        font-weight: 400;
        padding-bottom: 0;
        color: #000;
        letter-spacing: 0.5px;
      }

      label {
        display: block;
        cursor: pointer;
        margin-bottom: 6px;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 400;
        color: #333;
      }

      input[type="radio"] {
        margin-right: 6px;
        accent-color: #000000;
      }

      #container {
        flex-grow: 1;
        position: relative;
      }

      .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 400;
        color: #333;
      }
      .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 8px;
        flex-shrink: 0;
      }

      #tooltip {
        position: absolute;
        top: 20px;
        right: 30px;
        background: rgba(255, 255, 255, 0.95);
        padding: 15px 20px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        pointer-events: none;
        display: none;
        min-width: 200px;
      }

      #tooltip.visible {
        display: block;
      }

      #tooltip div {
        margin: 6px 0;
        font-size: 13px;
        color: #000;
        font-weight: 400;
      }

      #tooltip .tooltip-label {
        color: #666;
        font-family: var(--mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }

      #tooltip .tooltip-value {
        font-family: var(--sans);
        font-size: 14px;
        color: #000;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="sidebar-box">
        <div class="section">
          <h3>Projection</h3>
          <label
            ><input type="radio" name="projection" value="globe" checked />World
            Space</label
          >
          <label
            ><input type="radio" name="projection" value="embedding" />Embedding
            Space</label
          >
        </div>

        <div class="section" id="dim-reduction-section">
          <h3>Dimension Reduction</h3>
          <label
            ><input type="radio" name="dim_reduction" value="tsne" checked />
            t-SNE</label
          >
          <label
            ><input type="radio" name="dim_reduction" value="umap" />
            UMAP</label
          >
        </div>

        <div class="section">
          <h3>Legend Display</h3>
          <label
            ><input type="radio" name="color" value="classification" checked />
            Land Classification</label
          >
          <label
            ><input type="radio" name="color" value="region" /> Region</label
          >
        </div>

        <div class="section">
          <h3 id="legend-title">Legend</h3>
          <div id="legend"></div>
        </div>
      </div>
    </div>

    <div id="container">
      <div id="tooltip">
        <div class="tooltip-label">Location</div>
        <div class="tooltip-value" id="tooltip-location">—</div>
        <div class="tooltip-label">Classification</div>
        <div class="tooltip-value" id="tooltip-classification">—</div>
        <div class="tooltip-label">Region</div>
        <div class="tooltip-value" id="tooltip-region">—</div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="point_cloud.js"></script>
  </body>
</html>
