<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>embedding earth</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        display: flex;
        font-family: Helvetica, sans-serif;
        align-items: flex-start;
        background: white;
      }

      #sidebar {
        width: 260px;
        background: #f3f3f3;
        padding: 20px;
        margin: 20px;
        box-sizing: border-box;
        overflow: visible;
      }

      #sidebar h3 {
        margin-top: 0;
        font-size: 16px;
        font-weight: lighter;
      }

      #sidebar label {
        font-size: 14px;
      }

      .section {
        margin-bottom: 25px;
      }

      label {
        display: block;
        cursor: pointer;
        margin-bottom: 6px;
        font-weight: lighter;
      }

      input[type="radio"] {
        margin-right: 6px;
        accent-color: #000000;
      }

      #container {
        flex-grow: 1;
        position: relative;
      }

      .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: lighter;
      }
      .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 8px;
      }

      #tooltip {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #f5f5f5;
        padding: 15px;
        font-size: 12px;
        font-weight: lighter;
        pointer-events: none;
        display: none;
        min-width: 200px;
      }

      #tooltip.visible {
        display: block;
      }

      #tooltip strong {
        font-weight: normal;
        font-size: 13px;
      }

      #tooltip div {
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="section">
        <h3>Projection</h3>
        <label
          ><input type="radio" name="projection" value="globe" checked />World
          Space</label
        >
        <label
          ><input type="radio" name="projection" value="embedding" />Embedding
          Space</label
        >
      </div>

      <div class="section">
        <h3>Dimension Reduction</h3>
        <label
          ><input type="radio" name="dim_reduction" value="tsne" checked />
          t-SNE</label
        >
        <label
          ><input type="radio" name="dim_reduction" value="umap" /> UMAP</label
        >
      </div>

      <div class="section">
        <h3>Legend Display</h3>
        <label
          ><input type="radio" name="color" value="classification" checked />
          Land Classification</label
        >
        <label><input type="radio" name="color" value="region" /> Region</label>
      </div>

      <div class="section">
        <h3 id="legend-title">Legend</h3>
        <div id="legend"></div>
      </div>
    </div>

    <div id="container">
      <div id="tooltip">
        <div id="tooltip-lat"></div>
        <div id="tooltip-lon"></div>
        <div id="tooltip-classification"></div>
        <div id="tooltip-region"></div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="point_cloud.js"></script>
  </body>
</html>
